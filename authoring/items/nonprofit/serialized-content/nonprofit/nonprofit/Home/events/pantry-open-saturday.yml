    - ID: "53f49d04-a3f6-4f75-bc6e-3e7db6e80e93"
      Hint: Content
      Value: |
        <p>St Mark’s opens the pantry on a Saturday so people who work weekdays can still collect a three-day parcel. Sam Okoro is on the door. You do not need a professional referral. Jamal’s story on this site started at that door.</p>
        <p>If a child in the household has not eaten today, say so at reception — that is treated as an emergency pathway, same as a weekday drop-in. Parcels cover three days; a follow-up is booked before you leave.</p>
        <p>Register is not required. Walk in. If you need the emergency-grant page instead, start with Help when the money runs out.</p>
