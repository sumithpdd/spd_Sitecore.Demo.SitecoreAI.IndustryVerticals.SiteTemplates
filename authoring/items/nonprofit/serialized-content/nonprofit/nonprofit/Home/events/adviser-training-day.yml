      Hint: Content
      Value: |
        <p>A one-day session on taking energy and rent cases at the same desk. Eleri Morgan walks Discretionary Housing Payments; Jordan Hale covers supplier calls and winter disconnection rights.</p>
        <p>Places are for Openhand partner staff only. Bring a redacted case you are stuck on — the afternoon is clinic, not slides.</p>
        <p>The same two leads speak on the advice pages: energy bills (Jordan) and rent notices (Eleri). Training does not replace a live case — send households to Get help the same day.</p>
