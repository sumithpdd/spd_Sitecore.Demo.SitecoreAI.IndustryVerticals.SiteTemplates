      Hint: Content
      Value: |
        <p>A five-mile loop around Roundhay Park. Jordan Hale from Northgate Community Hub opens the route and walks the first mile with anyone who wants a slower start.</p>
        <p>Gifts raised on the day go to the winter match, now extended to 21 December. Bring a flask. The hub van will be at the lakeside car park with a warm space if you need to sit down.</p>
        <p>This is the named fundraising event in the Openhand demo story — the same walk the fundraise grid points to. Register from this page goes to donate because gifts, not tickets, fund the match.</p>
