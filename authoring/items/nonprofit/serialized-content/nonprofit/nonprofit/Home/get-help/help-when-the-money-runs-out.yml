      Hint: Content
      Value: |
        <p>If you are in the UK and the money has run out — rent short, empty cupboards, a bill you cannot pay this week — start with emergency help, not a loan.</p>
        <p>Local welfare and Household Support Fund schemes, plus a partner pantry, are usually faster than a new benefit claim. You do not need a professional referral for an Openhand pantry. Parcels cover three days; if a child has not eaten today, say so at reception.</p>
        <p>National advice can triage debt and housing. A crisis grant from a charity is often the next step if you need cash or goods this week. An advance on Universal Credit is a loan against your first payment — take it only if rent is due before that date, then ask the adviser to set a repayment you can keep.</p>
        <p>You should not be asked to donate before you get help. Openhand freephone <a href="tel:08000900000">0800 090 0000</a>, Monday to Saturday 8am–8pm, or walk into Northgate, St Mark’s or Riverside.</p>
        <p>Bring photo ID if you have it, a tenancy or last bill, and a bank statement. Missing documents stall grants more often than eligibility does.</p>
        <p>This is general information, not a personal assessment of your situation.</p>
