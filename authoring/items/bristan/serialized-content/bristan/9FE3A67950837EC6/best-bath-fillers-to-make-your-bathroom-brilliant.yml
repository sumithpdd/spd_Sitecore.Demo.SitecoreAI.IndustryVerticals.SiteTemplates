      Value: |
        <div style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(137, 137, 137);font-family:gotham_bookregular;font-size:15px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">&nbsp;</div><p><br /><br /><strong style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(137, 137, 137);font-family:gotham_bookregular;font-size:15px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;margin:0px;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><img style="border-width:0px;box-sizing:border-box;float:left;margin:0px 30px 10px 0px;padding:0px;" src="https://www.bristan.com/-/media/bristan/quest-bath-filler.ashx?h=297&amp;w=300&amp;hash=EF6E57C4531945C80BF09E2C3DFC77E8" alt="Quest Bath Filler" width="300" height="297" />Hotel inspired&nbsp;</strong><br /><br />&nbsp;</p><div style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(137, 137, 137);font-family:gotham_bookregular;font-size:15px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">&nbsp;Is luxury calling your name? The <a style="box-sizing:border-box;color:rgb(23, 36, 61);margin:0px;padding:0px;text-decoration:none;" href="https://www.bristan.com/products/Bathroom-Taps?code=DSC%20BF%20C">Descent Bath Filler</a> adds drama to any bathroom with a luxurious cascade water effect.<br /><br />The Descent has a precise glide and can be paired with matching taps and showers for a stylish, cohesive look that will give your bathroom a hotel feel. This filler is available in luminance chrome and is priced at £263.&nbsp;<br /><br /><br /><strong style="box-sizing:border-box;margin:0px;padding:0px;">The perfect curve for contemporary bathrooms</strong><br /><br />With curves in all the right places, the fresh and modern design of <a style="box-sizing:border-box;color:rgb(23, 36, 61);margin:0px;padding:0px;text-decoration:none;" href="https://www.bristan.com/products/Bathroom-Taps?code=QST%20BF%20C">Quest Bath Filler</a> is perfect for a contemporary bathroom.<br /><br />Built to last with a robust design, the Quest bath filler not only stands the test of time, but does so whilst looking brilliant. The Quest also has easy-to-use metal handles for everyday practicality. The Quest is priced at £194.<br />&nbsp;<br /><br /><strong style="box-sizing:border-box;margin:0px;padding:0px;"><img style="border-width:0px;box-sizing:border-box;float:right;margin:0px 0px 20px 30px;padding:0px;" src="https://www.bristan.com/-/media/bristan/blitz-bath-filler.ashx?h=263&amp;w=300&amp;hash=C724FC64ABE3C0BFD5D5EB324F90BBB3" alt="Blitz Bath Filer" width="300" height="263" />Effortless, modern design</strong><br /><br />With sleek lines and a modern design, the <a style="box-sizing:border-box;color:rgb(23, 36, 61);margin:0px;padding:0px;text-decoration:none;" href="https://www.bristan.com/products/Bathroom-Taps?code=BTZ%20BF%20C">Blitz Bath Filler</a> complements any bathroom size and design. This filler is effortless to use and easy to clean, which is perfect for families and busy households.<br /><br />The secure fix and vibrant chrome keep the Blitz looking sharp and running smoothly. At the brilliant price of £147, this staple filler ticks all the boxes.&nbsp;<br /><strong style="box-sizing:border-box;margin:0px;padding:0px;"><img style="border-width:0px;box-sizing:border-box;float:left;margin:0px 30px 0px 0px;padding:0px;" src="https://www.bristan.com/-/media/bristan/bright-bath-filler.ashx?h=300&amp;w=300&amp;hash=44010ED2F1C5A6B7FEA774B1FCFCF69C" alt="Bright Bath Filler" width="300" height="300" /></strong></div><div style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(137, 137, 137);font-family:gotham_bookregular;font-size:15px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><br /><br /><strong style="box-sizing:border-box;margin:0px;padding:0px;">Bold, geometric style</strong><br /><br />Geometric design is at the heart of the <a style="box-sizing:border-box;color:rgb(23, 36, 61);margin:0px;padding:0px;text-decoration:none;" href="https://www.bristan.com/products/Bathroom-Taps?code=BRG%20BF%20C">Bright Bath Filler</a>, and with a softened, triangular design, it’s ideal for bold bathrooms.<br /><br />The modern flair of this filler isn’t just in its style, but in its design technology too, with a suitable design for all plumbing systems. The Bright bath filler is priced at £289.&nbsp;<br /><br /><br /><strong style="box-sizing:border-box;margin:0px;padding:0px;">Classic bathroom regency&nbsp;</strong><br /><br />Regency-inspired bathrooms with traditional style would be the perfect match to the <a style="box-sizing:border-box;color:rgb(23, 36, 61);margin:0px;padding:0px;text-decoration:none;" href="https://www.bristan.com/products/Bathroom-Taps?code=RS2%20BF%20C">Renaissance Bath Filler</a>.&nbsp;<br /><br /><strong style="box-sizing:border-box;margin:0px;padding:0px;"><img style="border-width:0px;box-sizing:border-box;float:right;margin:0px 0px 0px 30px;padding:0px;" src="https://www.bristan.com/-/media/bristan/renaissance-bath-filler.ashx?h=300&amp;w=300&amp;hash=E99356ACAE7E4F57E8DD205CCD67E018" alt="Renaissance Bath Filler" width="300" height="300" /></strong>Inspired by the Italian Renaissance, the intricate styling of the hand-finished handles made using precision watchmaker techniques adds a touch of luxury to any bathroom.&nbsp;<br /><br />Not only is this tap made for chic style, but it stands the test of time with a metal fixing nut for added durability. The Renaissance bath filler is priced at £289.</div><div style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(137, 137, 137);font-family:gotham_bookregular;font-size:15px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><br />You can have complete confidence that our wide range of bath fillers are easy to choose, use and install, and are built with lasting integrity.<br /><br />That’s why all of the bath fillers listed are guaranteed for 10 years. Our aim is to make your life brilliantly simple – and your bathroom simply brilliant.<br /><br />Discover the full Bristan range <a style="box-sizing:border-box;color:rgb(23, 36, 61);margin:0px;padding:0px;text-decoration:none;" href="https://www.bristan.com/homeowners-home">here</a>.&nbsp; &nbsp;</div>
