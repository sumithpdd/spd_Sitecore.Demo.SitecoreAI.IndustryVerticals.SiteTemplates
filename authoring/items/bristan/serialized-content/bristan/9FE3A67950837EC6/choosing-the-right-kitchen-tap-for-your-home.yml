      Value: From single-lever mixers to boiling water taps — a practical guide to finding the right kitchen tap for how you live.
    - ID: "c97b8c3c-2801-4b14-9bf8-f11ec7ab1d11"
      Hint: Title
      Value: Choosing the right kitchen tap for your home
    - ID: "581d7a02-ce94-4a73-9add-258867a8b60f"
      Hint: Content
      Value: |
        <div class="ck-content"><p>Your kitchen tap is one of the hardest-working fixtures in the home. Whether you are replacing a worn mixer or planning a full kitchen renovation, consider reach, height and how you use your sink day to day.</p>
        <p>Single-lever mixers offer intuitive temperature control and a clean, modern silhouette. Pull-out spray models make rinsing dishes and filling pans easier, while bridge-style taps suit traditional shaker kitchens.</p>
        <p>Bristan kitchen taps are WRAS approved and available in chrome, black, stainless steel and brushed brass to coordinate with your appliances and hardware.</p></div>
