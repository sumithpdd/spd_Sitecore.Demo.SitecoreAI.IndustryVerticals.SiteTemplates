        <div class="ck-content"><h2>The Perfect Finish</h2><p>Whether your bathroom is craving chrome, or seeking a statement piece, you&rsquo;re sure to find the perfect finish with Bristan bathroom taps. Available in tried and tested chrome, the ever-popular black, striking brushed brass and sophisticated gun metal grey.</p><h3>Chrome</h3><p>A true classic finish. Chrome creates contrast to darker colour schemes while effortlessly blending with lighter spaces.</p><h3>Black</h3><p>Black is a deep, elegant colour with a matte finish that offers a striking contrast against lighter surfaces.</p><h3>Brushed Brass</h3><p>Brushed Brass is a standout finish. Its subtle yet striking look adds a touch of luxury to any room.</p><h3>Gun Metal Grey</h3><p>Our gunmetal taps and showers in a dark, sophisticated grey colour with a subtle lustre &mdash; perfect for a timeless feel.</p></div>
