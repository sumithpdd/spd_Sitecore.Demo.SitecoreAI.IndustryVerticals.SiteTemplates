        <div class="ck-content"><h2>Mixer showers for every bathroom</h2><p>Whether you need a little help waking up or want to feel reinvigorated after a long day, our range of mixer showers are guaranteed to leave you feeling refreshed. From exposed mini valve showers and stylish bar showers to trend-led concealed showers, we have styles and finishes to suit any bathroom.</p></div>

