    - ID: "a1e90011-0000-4000-8000-000000000098"
      Hint: Body
      Value: |
        <p>We help clients in Professional and Public Services by offering practical solutions shaped by our strong expertise in a range of specialisms including corporate and commercial contracts, funding, planning, and project management. With international experience and offices across the globe, we advise on commercial, regulatory, cross border and cultural challenges. This helps us reduce risks and create more opportunities for our clients.</p>
        <h2 id="professional-services">Professional Services</h2>
        <p>Accountants, administrators, consultants and professional practices — including the AIM listed law firm work on Dawn Allen’s experience tab.</p>
        <h2 id="public-sector">Public Sector</h2>
        <p>Government and public sector organisations, from planning and project life-cycle through to the regulatory regimes that sit around them.</p>
