    - ID: "62d161c2-fb5d-4773-8d46-63c21c95a441"
      Hint: Content
      Value: "<p>Our annual London conference is the day Vince can put Dawn Allen in a room with the lender community — not another PDF. Dawn chairs. Sally Williamson walks the CIGA essential-supplier rules that sit behind the Out-Law guide. Hammad Akhtar covers the insurance and lending questions that follow a customer failure.</p><p>Hospitality and a full-day programme, written for this demo. Original copy — not the live Pinsent brochure.</p><h3>Who should attend</h3><p>Bankers, insolvency practitioners, funds and in-house counsel who need a usable briefing they can take into a Barclays-style meeting.</p>"
