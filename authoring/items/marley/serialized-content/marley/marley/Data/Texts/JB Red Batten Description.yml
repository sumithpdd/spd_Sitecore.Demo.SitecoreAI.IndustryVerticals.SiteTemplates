        <div class="ck-content"><h2>Description</h2><p>Our JB Red battens are the only UK factory graded roof batten with BBA certification. Produced from high-grade, slow-grown and kiln-dried sideboards for maximum strength and stability — easily identifiable on site due to red pigment.</p></div>

