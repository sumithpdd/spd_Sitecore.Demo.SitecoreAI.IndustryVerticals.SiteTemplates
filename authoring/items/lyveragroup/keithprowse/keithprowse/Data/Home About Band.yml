      Value: "<p>We're the official sports & events premium experiences provider for many iconic venues and stadiums across the country, including Allianz Stadium and Wimbledon. For over 220 years, the name Keith Prowse has been synonymous with the top sporting, social and cultural events in the UK.</p><p>Innovation and customer service are at the heart of what we do for both corporate client hospitality and individual VIP experiences. We're passionate about delivering the ultimate high-end experiences and packages, guaranteeing to turn any sporting spectacle or cultural event into a cherished memory that will last for a lifetime.</p>"
