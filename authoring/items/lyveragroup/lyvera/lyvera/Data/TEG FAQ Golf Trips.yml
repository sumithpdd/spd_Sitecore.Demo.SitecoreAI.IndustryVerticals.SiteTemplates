      Value: What golf trips do you offer?
    - ID: "b7010060-0001-400d-8010-000000001502"
      Hint: Answer
      Value: "<p>The Experience Golf specialises in creating exceptional, tailor-made golf journeys to the world's most iconic destinations. Our heritage lies in St Andrews — home of the Old Course and the sport's most storied traditions — but our expertise extends beyond. From Ireland's rugged links and England's championship courses to the iconic fairways of the Scottish Highlands, we curate access to the very best golf experiences in this beautiful golf region.</p>"
