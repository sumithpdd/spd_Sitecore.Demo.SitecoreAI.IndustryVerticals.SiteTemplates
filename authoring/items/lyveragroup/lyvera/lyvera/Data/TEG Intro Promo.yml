      Value: "<p><img src=\"/images/brands/the-experience-golf.png\" alt=\"The Experience Golf\" width=\"200\" /></p><p>The Experience Golf, part of Lyvera Group, designs exceptional golf journeys for those who want to experience the game at its very finest. Specialising in luxury golf travel across the UK and Ireland, we create seamless, personalised itineraries that combine world-class courses with outstanding service and unforgettable moments both on and off the fairway. Events such as the iconic <strong>Father and Son Tournament</strong> celebrates the magic of the game through passion, emotion and memory making at the iconic Home of Golf, <strong>St Andrews</strong>, and the appointment as <strong>Official Tour Operator for the 2027 Ryder Cup at Adare Manor</strong> offers guaranteed access to one of the most celebrated events in the sporting calendar.</p>"
