      Value: The compact label printer that gives you full colour labels on demand from your PC, Mac, smartphone or tablet.
    - ID: "b40e0006-6666-4000-8000-000000000033"
      Hint: Description
      Value: |
        <p>The compact VC-500W wireless colour photo printer features ZINK® Zero Ink Technology that allows you to print amazing full colour labels, photos, stickers and more up to 420mm long in a single pass without the need for ink cartridges, ribbons or toners.</p>
        <p>Create handmade gifts, greeting cards, invitations, scrapbooks, address labels and more — then peel and stick to most surfaces. Print wirelessly from the free Color Label Editor app with frames, fonts, art and ready-made designs.</p>
