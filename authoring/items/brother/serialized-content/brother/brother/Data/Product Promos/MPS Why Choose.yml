    - ID: "466b77bb-7d3f-4963-9000-260f4d29a4a8"
      Hint: Description
      Value: |
        <ul><li><strong>Automatic ink and toner delivery</strong> &ndash; supplies always arrive before you run out, so there&rsquo;s one less thing to worry about.</li><li><strong>Reduced ongoing costs</strong> &ndash; the cheapest way to get genuine supplies, with complete cost transparency.</li><li><strong>Support and maintenance</strong> &ndash; we respond within four business hours over the phone, or send an engineer the next business day.</li><li><strong>Remanufacturing and recycling</strong> &ndash; we divert used cartridges from landfill and remanufacture them to be used again.</li><li><strong>Flexible service</strong> &ndash; amend your print management plan at any time to suit your business.</li><li><strong>Stay in control with the Brother MPS portal</strong> &ndash; monitor usage, request support and change your service.</li><li><strong>Peace of mind</strong> &ndash; your Brother printers are repaired or replaced for as long as you&rsquo;re an MPS customer.</li></ul>
