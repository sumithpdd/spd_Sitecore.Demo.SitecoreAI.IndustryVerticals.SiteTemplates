      Value: "How a small print studio reworked its workflow around an A3 inkjet printer &mdash; shorter turnarounds, lower running costs and happier customers."
    - ID: "1a0ef26a-eff1-4e82-87f8-b5fd7a9c57be"
      Hint: Body
      Value: |
        <p>For a studio producing short-run artwork and packaging, the bottleneck was rarely creativity &mdash; it was waiting on print. Moving proofing in-house changed what the team could promise customers.</p>
        <h2>What changed</h2>
        <ul>
          <li>Proofs printed in minutes instead of being outsourced overnight.</li>
          <li>Predictable cost per page made quoting straightforward.</li>
          <li>Labelling orders in-house cut packing mistakes.</li>
        </ul>
        <h2>What to take away</h2>
        <p>Look at the steps where work waits rather than the steps where work happens. That is usually where a device pays for itself.</p>
