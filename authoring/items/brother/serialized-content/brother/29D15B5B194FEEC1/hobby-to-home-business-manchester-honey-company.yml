      Value: "A Manchester family&rsquo;s love of honey turned a beekeeping hobby into a home business &mdash; and jar labels they can print on demand."
    - ID: "1a0ef26a-eff1-4e82-87f8-b5fd7a9c57be"
      Hint: Body
      Value: |
        <p>What started with clearing swarms from neighbours&rsquo; gardens became a kitchen-table business selling local honey. Growth brought a problem familiar to every home business: packaging that looks the part without a print run you cannot afford.</p>
        <h2>Labels on demand</h2>
        <ul>
          <li>Full-colour jar labels printed in small batches as each harvest is bottled.</li>
          <li>Batch numbers and harvest dates added without reordering pre-printed stock.</li>
        </ul>
        <h2>Room to grow</h2>
        <p>Printing in-house keeps seasonal products viable &mdash; a limited run of 40 jars is worth doing when the labels cost pennies and take minutes.</p>
