      Value: |
        <p>Law Roach is stylist in residence for the season. The brief is a soft shoulder, a long coat, and one pair of jeans that can leave a lecture and still look considered on the train home.</p><p>He keeps the palette chocolate, grey, and black. The jean does the work of a trouser: wide through the leg, mid wash, one size kept rather than three tried on. UK 8 on the model at 5'7".</p><p>Autumn, in this edit, is not a new silhouette every week. It is the same jean with the knit and the boot, worn until the coat comes off.</p>
