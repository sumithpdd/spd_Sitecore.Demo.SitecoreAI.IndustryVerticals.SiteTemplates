      Hint: Body
      Value: |
        <p>Start with the jean. A mid-wash wide leg under £50 is the uniform: it sits with a knit, a shirt, or the coat you already own.</p><p>Petite and tall cuts are in the same edit, so the hem lands on the boot instead of the floor. If UK 8 is your size, keep it. The label on the mid-wash jean says the model is 5'7" and wears that size.</p><p>The rest of the week is the same pair. Seminar, library, the late train. Denim is the piece that does not need a second outfit.</p>
